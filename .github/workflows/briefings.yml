name: ZJX briefings

on:
  schedule:
    # Open-Meteo has the 00Z and 12Z GFS cycles by ~05Z / ~17Z.
    - cron: "40 5 * * *"
    - cron: "40 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  # The OM/TMU/OS maps are issued once each morning (05:40Z = 00:40 EST /
  # 01:40 EDT, well before 0500 local) and on manual runs. The evening run
  # carries the morning's maps forward unchanged.
  TMU: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '40 5 * * *' }}

concurrency:
  group: briefings
  cancel-in-progress: false

jobs:
  briefings:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts and Python packages
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter || true
          pip install -r requirements.txt

      - name: Download GFS from Open-Meteo
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python -m zjxwx fetch --start today --days 6 --out gfs.json

      - name: Render briefings
        run: |
          mkdir -p out
          for s in F N; do
            python -m zjxwx brief  gfs.json --date next  --shift $s --out out/brief_$s.png  --json out/brief_$s.json
            python -m zjxwx string gfs.json --start next --days 5 --shift $s --out out/string_$s.png --json out/string_$s.json
          done

      - name: OM/TMU/OS maps (NBM from AWS open data + GFS)
        id: tmu
        if: env.TMU == 'true'
        continue-on-error: true
        run: |
          python -m zjxwx nbm --date today --out nbm.npz \
            || echo "::warning::NBM download failed; OM/TMU/OS maps fall back to GFS only"
          python -m zjxwx tmu gfs.json $( [ -f nbm.npz ] && echo --nbm nbm.npz ) --date today --outdir out/tmu

      - name: Carry forward this morning's OM/TMU/OS maps
        if: env.TMU != 'true' || steps.tmu.outcome == 'failure'
        run: |
          rm -rf out/tmu
          git fetch -q --depth 1 origin briefings \
            && git archive FETCH_HEAD tmu | tar -x -C out \
            || echo "No earlier OM/TMU/OS maps on the briefings branch"

      - name: Write the web page
        run: python tools/write_index.py out

      - name: Publish to the briefings branch
        run: |
          cd out
          git init -q -b briefings
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Briefings $(date -u +%Y-%m-%dT%H%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" briefings

      - uses: actions/upload-artifact@v4
        with:
          name: briefings
          path: out/
          retention-days: 14

      - name: Compress model data
        run: gzip -k gfs.json

      - uses: actions/upload-artifact@v4
        with:
          name: gfs-data
          path: gfs.json.gz
          retention-days: 3
