name: ZJX briefings

on:
  schedule:
    # Morning: three tries for the OM/TMU/OS maps (01:15-03:45 EST /
    # 02:15-04:45 EDT). GitHub starts scheduled runs late (4-8 h was seen in
    # Nov 2026) and sometimes drops them, so the first one to start does the
    # work and the later ones exit straight away (see the plan job).
    - cron: "15 6 * * *"
    - cron: "30 7 * * *"
    - cron: "45 8 * * *"
    # Evening refresh of the briefing sheets (12Z GFS).
    - cron: "40 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: briefings
  cancel-in-progress: false

jobs:
  # Decide what this run does from what is already published:
  #  - manual run: everything, including fresh OM/TMU/OS maps;
  #  - morning schedule: everything if today's maps are not out yet, else nothing;
  #  - evening schedule: briefings, plus the maps only if the morning never made them.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.plan.outputs.run }}
      tmu: ${{ steps.plan.outputs.tmu }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          PUB=$( (git fetch -q --depth 1 origin briefings && git show FETCH_HEAD:tmu/tmu.json \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["day"])') 2>/dev/null || echo none)
          if [ "$EVENT" = workflow_dispatch ]; then run=true; tmu=true
          elif [ "$SCHED" = "40 17 * * *" ]; then run=true; if [ "$PUB" = "$TODAY" ]; then tmu=false; else tmu=true; fi
          elif [ "$PUB" = "$TODAY" ]; then run=false; tmu=false
          else run=true; tmu=true
          fi
          echo "today=$TODAY published=$PUB event=$EVENT schedule='$SCHED' -> run=$run tmu=$tmu"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "tmu=$tmu" >> "$GITHUB_OUTPUT"

  briefings:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    env:
      TMU: ${{ needs.plan.outputs.tmu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts and Python packages
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter || true
          pip install -r requirements.txt

      - name: Download GFS from Open-Meteo
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python -m zjxwx fetch --start today --days 6 --out gfs.json

      - name: Render briefings
        run: |
          mkdir -p out
          for s in F N; do
            python -m zjxwx brief  gfs.json --date next  --shift $s --out out/brief_$s.png  --json out/brief_$s.json
            python -m zjxwx string gfs.json --start next --days 5 --shift $s --out out/string_$s.png --json out/string_$s.json
          done

      - name: OM/TMU/OS maps (HRRR + NBM from AWS open data, plus GFS)
        id: tmu
        if: env.TMU == 'true'
        continue-on-error: true
        run: |
          python -m zjxwx nbm --date today --out nbm.npz \
            || echo "::warning::NBM download failed; OM/TMU/OS maps fall back to GFS only"
          python -m zjxwx hrrr --date today --out hrrr.npz \
            || echo "::warning::HRRR download failed; thunderstorms from NBM and GFS only"
          python -m zjxwx tmu gfs.json $( [ -f nbm.npz ] && echo --nbm nbm.npz ) \
            $( [ -f hrrr.npz ] && echo --hrrr hrrr.npz ) --date today --outdir out/tmu

      - name: Carry forward this morning's OM/TMU/OS maps
        if: env.TMU != 'true' || steps.tmu.outcome == 'failure'
        run: |
          rm -rf out/tmu
          git fetch -q --depth 1 origin briefings \
            && git archive FETCH_HEAD tmu | tar -x -C out \
            || echo "No earlier OM/TMU/OS maps on the briefings branch"

      - name: Write the web page
        run: python tools/write_index.py out

      - name: Publish to the briefings branch
        run: |
          cd out
          git init -q -b briefings
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Briefings $(date -u +%Y-%m-%dT%H%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" briefings

      - uses: actions/upload-artifact@v4
        with:
          name: briefings
          path: out/
          retention-days: 14

      - name: Compress model data
        run: gzip -k gfs.json

      - uses: actions/upload-artifact@v4
        with:
          name: gfs-data
          path: gfs.json.gz
          retention-days: 3
