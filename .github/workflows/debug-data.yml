name: Copy model data to a branch (debug)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run whose gfs-data artifact to copy
        required: true
permissions:
  contents: write
  actions: read
jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gfs-data
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data
      - run: |
          cd data
          git init -q -b debug-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "GFS grid from run ${{ inputs.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" debug-data
